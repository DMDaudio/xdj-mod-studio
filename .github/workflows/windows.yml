# Windows build of XDJ Mod Studio (public, bring-your-own-firmware).
#   natives  (Linux, MinGW-w64 cross): emulator C cores as DLLs, the tic6x
#            objdump the audio-chip emulator decodes with, hidapi.dll
#   app      (Windows): PyInstaller app + zip, smoke test (server starts,
#            UI loads, /api/state answers, built-in checks pass)
# Run by hand (Actions > Windows > Run workflow); with "release" set, the
# zip is attached to that GitHub release. No firmware is involved anywhere.
name: Windows
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to attach the zip to (empty = just build)"
        required: false
        default: ""
  push:
    branches: [master]
    paths-ignore: ["site/**", "*.md"]
permissions:
  contents: write
jobs:
  natives:
    runs-on: ubuntu-latest
    env:
      BINUTILS: binutils-2.43.1
      BINUTILS_SHA: 13f74202a3c4c51118b797a39ea4200d3f6cfbe224da6d1d95bb938480132dfd
      HIDAPI: hidapi-0.14.0
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64 >/dev/null
      - name: Emulator cores (DLL)
        run: |
          mkdir -p out
          CC=x86_64-w64-mingw32-gcc
          $CC -O2 -shared -static -static-libgcc -o out/_fastcore.dll emu/fastcore.c -lm
          $CC -O2 -shared -static -static-libgcc -o out/_c6xcore.dll emu/c6x/c6xcore.c -lm
      - uses: actions/cache@v4
        id: objcache
        with:
          path: objdump-cache
          key: tic6x-objdump-win64-${{ env.BINUTILS }}-v1
      - name: tic6x objdump for Windows (GNU binutils)
        if: steps.objcache.outputs.cache-hit != 'true'
        run: |
          curl -sSLO https://ftp.gnu.org/gnu/binutils/$BINUTILS.tar.xz
          echo "$BINUTILS_SHA  $BINUTILS.tar.xz" | sha256sum -c -
          tar xf $BINUTILS.tar.xz
          mkdir bld && cd bld
          ../$BINUTILS/configure --host=x86_64-w64-mingw32 --target=tic6x-elf \
            --disable-nls --disable-werror --disable-gdb --disable-gprof --disable-ld \
            --disable-gas --disable-gold --disable-sim --without-zstd \
            LDFLAGS="-static -static-libgcc" > cfg.log
          make -j"$(nproc)" MAKEINFO=true all-binutils > make.log 2>&1 || { tail -50 make.log; exit 1; }
          mkdir -p ../objdump-cache
          cp binutils/objdump.exe ../objdump-cache/
      - name: hidapi.dll (deck USB)
        run: |
          cp objdump-cache/objdump.exe out/
          curl -sSL -o hidapi-win.zip https://github.com/libusb/hidapi/releases/download/$HIDAPI/hidapi-win.zip
          unzip -q -o hidapi-win.zip -d hidapi
          cp "$(find hidapi -path '*x64*' -name hidapi.dll | head -1)" out/hidapi.dll
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: win-natives
          path: out/

  app:
    needs: natives
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: win-natives
          path: build/win-natives
      - name: Python packages
        run: python -m pip install --quiet pyinstaller numpy pillow pygame capstone
      - name: Build the app
        env:
          XDJ_VERSION: ${{ github.event.inputs.release || 'dev' }}
        run: python tools/build_studio_win.py
      - name: Smoke test (fresh user, no firmware, no deck)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $t = Join-Path $env:RUNNER_TEMP "smoke"
          Remove-Item -Recurse -Force $t -ErrorAction SilentlyContinue
          New-Item -ItemType Directory $t | Out-Null
          Expand-Archive "dist/win/XDJ-Mod-Studio-Windows.zip" -DestinationPath $t
          $app = Join-Path $t "XDJ Mod Studio"
          $exe = Join-Path $app "XDJ Mod Studio.exe"
          $env:LOCALAPPDATA = Join-Path $t "appdata"      # empty user profile
          New-Item -ItemType Directory $env:LOCALAPPDATA | Out-Null
          # must be a windowed (GUI-subsystem) exe: no black console window
          $b = [IO.File]::ReadAllBytes($exe); $pe = [BitConverter]::ToInt32($b, 0x3C)
          $sub = [BitConverter]::ToUInt16($b, $pe + 0x5C)
          if ($sub -ne 2) { throw "exe subsystem is $sub, expected 2 (windowed)" }
          Write-Host "exe is windowed (subsystem 2)"
          # windowed exe: PowerShell won't wait for it or show its output on
          # its own, so wait explicitly and print the redirected output
          $st = Join-Path $t "selftest.log"
          $q = Start-Process -FilePath $exe -ArgumentList "--run-tool","tools/win_selftest.py" `
                 -WorkingDirectory $app -RedirectStandardOutput $st `
                 -RedirectStandardError "$st.err" -Wait -PassThru
          Get-Content $st, "$st.err" -ErrorAction SilentlyContinue
          if ($q.ExitCode -ne 0) { throw "built-in checks failed" }
          if (-not (Select-String -Path $st -Pattern "RESULT: PASS" -Quiet)) { throw "no PASS line" }
          $log = Join-Path $t "server.log"
          $p = Start-Process -FilePath $exe -ArgumentList "--no-browser","--port","8799" `
                 -RedirectStandardOutput $log -RedirectStandardError "$log.err" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep 2
            try {
              $s = Invoke-RestMethod "http://127.0.0.1:8799/api/state" -TimeoutSec 5
              $ok = $true; break
            } catch {}
            if ($p.HasExited) { break }
          }
          Get-Content $log, "$log.err" -ErrorAction SilentlyContinue | Select-Object -Last 40
          if (-not $ok) { throw "/api/state never answered" }
          $s | ConvertTo-Json -Depth 3 | Select-Object -First 40
          $html = (Invoke-WebRequest "http://127.0.0.1:8799/" -UseBasicParsing).Content
          if ($html -notmatch "XDJ Mod Studio") { throw "UI page did not load" }
          if ($s.fw_ready) { throw "fresh user should have no firmware" }
          Write-Host "SMOKE: PASS (server up, UI loads, /api/state answers)"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: XDJ-Mod-Studio-Windows
          path: dist/win/XDJ-Mod-Studio-Windows.zip
      - name: Attach to release
        if: github.event.inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.inputs.release }}" dist/win/XDJ-Mod-Studio-Windows.zip --clobber
